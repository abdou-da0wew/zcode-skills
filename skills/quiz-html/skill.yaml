name: quiz_html
version: 0.1.0
description: Injects a question JSON array into a template to generate a single-file HTML practice page

entrypoints:
  build: scripts/build_quiz_html.py

features:
  - html_quiz_generation
  - multi_question_type
  - category_filter
  - state_filter
  - exam_mode
  - keyboard_shortcuts
  - dark_mode
  - localstorage_persistence
  - mobile_responsive

depends_on:
  - quiz-mastery  # upstream: source of question data

triggers:
  # Direct keywords
  - "generate a web page"
  - "make it a web page"
  - "make an HTML page"
  - "web version"
  - "practice in the browser"
  - "export as HTML"
  - "do the practice on a web page"

  # Chained triggers after quiz-mastery finishes
  - quiz_generated  # question generation finished event
  - quiz_imported   # question import finished event

io:
  input:
    type: file
    format: json
    schema:
      type: array
      items:
        required: [type, prompt, answer]
        properties:
          type: {enum: [single_choice, true_false, fill_blank, short_answer]}
          prompt: {type: string}
          options: {type: array, items: {type: string}}
          answer: {type: string}
          explanation: {type: string}
          knowledge_point: {type: string}
          category: {type: string}
          level: {type: integer, minimum: 1, maximum: 3}
          memory_tip: {type: string}
  output:
    type: file
    format: html
    self_contained: true  # single file, no external dependencies
